name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Plugin Version
        id: version
        shell: bash
        run: |
          version="$(./gradlew properties --quiet --console=plain | awk '/^version: / {print $2}')"
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Could not determine a valid plugin version: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build Plugin
        run: ./gradlew clean buildPlugin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*-${{ steps.version.outputs.VERSION }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('Release v{0}', steps.version.outputs.VERSION) }}
          tag_name: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          target_commitish: ${{ github.sha }}
